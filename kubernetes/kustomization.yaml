apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
images:
- name: karma12/eqdev-spring-boot
  newTag: d11

resources:
- app-deploy.yml
- app-service.yml
patchesStrategicMerge:
- | 
  apiVersion: v1
  kind: Service
  metadata:
    name: springbootdev-backend
  spec:
    ports:
    - nodePort: 32000




