apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
images:
- name: karma12/eqdev-spring-boot
  newTag: d11

resources:
- app-deploy.yml
- app-service.yml
patches:
  - target:
      kind: Service
      name: springbootdev-backend
    patch: |
      - op: replace
        path: /spec/ports/0/nodePort
        value: 32000




