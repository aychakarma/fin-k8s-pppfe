apiVersion: triggers.tekton.dev/v1alpha1
kind: EventListener
metadata:
  name: argocd-listener-fin
  namespace: default
spec:
  serviceAccountName: docker-login
  triggers:
    - name: autre-trigger
      bindings:
        - ref: clone-trigger
      template:
        ref: clone-templates
  interceptors:
    - cel:
        filter: "source.branch == 'dev' && source.author == 'aychakarma'"
  resources:
    kubernetesResource:
      serviceType: NodePort
